version: '3.8'

services:
  # Primary Backend & MCP Service
  api-primary:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-management-primary
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    restart: unless-stopped

  # Replicated / Secondary Copy of Container
  api-replica:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-management-replica
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    restart: unless-stopped
